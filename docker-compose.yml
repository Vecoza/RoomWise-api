services:
  db:
    image: postgres:16
    container_name: roomwise-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Vedran123
      POSTGRES_DB: RoomWise
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: roomwise-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@roomwise.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    depends_on:
      - db
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      
  api:
    build:
      context: .
      dockerfile: RoomWise.Api/Dockerfile
    container_name: roomwise-api
    env_file:
      - RoomWise.Api/.env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5184
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=RoomWise;Username=postgres;Password=Vedran123
      RabbitMq__HostName: rabbitmq
      RabbitMq__Port: 5672
      RabbitMq__UserName: guest
      RabbitMq__Password: guest
      RabbitMq__EmailQueueName: email_notifications
    depends_on:
      - db
      - rabbitmq
    ports:
      - "5184:5184"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: roomwise-rabbit
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  pgdata:
  pgadmin_data:

